    <script>
      // Break out of domain-masked iframes to preserve native mobile responsiveness & viewport tags
      if (window.self !== window.top) {
        try {
          window.top.location.replace(window.self.location.href);
        } catch (e) {
          console.warn("Iframe breakout blocked by browser security. Please configure proper DNS CNAME/A records instead of masked forwarding.");
        }
      }
    </script>
